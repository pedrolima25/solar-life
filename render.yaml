# Render Blueprint — cria o servidor (API) e o banco PostgreSQL do Solar Life.
# No painel do Render: New > Blueprint > escolha este repositório.
databases:
  - name: solar-life-db
    plan: basic-256mb          # ~US$ 6/mês (o plano grátis apaga o banco após 30 dias)
    region: virginia
    databaseName: solarlife
    user: solarlife

services:
  - type: web
    name: solar-life-api
    runtime: python
    plan: starter              # ~US$ 7/mês (o plano grátis "dorme" e demora ~1 min para acordar)
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: America/Boa_Vista
      - key: DATABASE_URL
        fromDatabase:
          name: solar-life-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false            # o Render pede na criação: e-mail do administrador
      - key: ADMIN_PASSWORD
        sync: false            # o Render pede na criação: senha forte (mín. 8 caracteres)
      - key: CORS_ORIGINS
        sync: false            # endereço do site na Vercel, ex.: https://solar-life.vercel.app
